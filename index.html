<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Apollonian Gasket Live</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0408; font-family: ui-monospace, monospace; color: #ddd; }
  #gl { position: fixed; display: block; width: 100vw; height: 100vh; touch-action: none; }

  /* Admin toggle button (shown only in viewer mode) */
  #adminToggle {
    position: fixed; top: 12px; right: 12px; z-index: 10;
    padding: 8px 14px;
    background: rgba(20,10,30,0.7); backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.18); border-radius: 8px;
    color: #fff; font: 11px ui-monospace, monospace;
    text-decoration: none; cursor: pointer; z-index: 100;
  }
  #adminToggle:hover { background: rgba(40,20,60,0.85); }
  body.admin #adminToggle { display: none; }

  /* Admin panel */
  #admin {
    position: fixed; top: 0; right: 0; bottom: 0; width: 320px;
    background: rgba(10,5,18,0.92); backdrop-filter: blur(12px);
    border-left: 1px solid rgba(255,255,255,0.12);
    color: #eee; font: 11px ui-monospace, monospace;
    overflow-y: auto; padding: 14px; z-index: 50;
    display: none;
  }
  body.admin #admin { display: block; }
  #admin h1 { font-size: 13px; margin: 0 0 12px 0; letter-spacing: 0.08em; text-transform: uppercase; color: #ff8a8a; }
  #admin .group { margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.06); }
  #admin .group:last-child { border-bottom: none; }
  #admin label { display: block; font-size: 10px; opacity: 0.7; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em; }
  #admin input[type=range] { width: 100%; margin: 4px 0 8px 0; accent-color: #ff4d6d; }
  #admin input[type=color] { width: 36px; height: 24px; padding: 0; border: 1px solid #444; border-radius: 4px; vertical-align: middle; margin-left: 6px; cursor: pointer; }
  #admin select { background: #1a0e25; color: #eee; border: 1px solid #444; border-radius: 4px; padding: 4px 6px; font: 11px ui-monospace; }
  #admin .row { display: flex; gap: 6px; align-items: center; }
  #admin .val { font-size: 10px; opacity: 0.7; min-width: 36px; text-align: right; }
  #admin .palette { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-top: 4px; }
  #admin .palette button {
    height: 22px; border: 1px solid rgba(255,255,255,0.2); border-radius: 4px;
    cursor: pointer; padding: 0; background: none;
  }
  #admin .palette button.active { border-color: #fff; box-shadow: 0 0 0 2px #ff4d6d; }
  #admin .close {
    position: absolute; top: 8px; right: 12px;
    background: none; border: none; color: #aaa; font-size: 18px; cursor: pointer;
  }
  #admin .close:hover { color: #fff; }

  /* Status indicator */
  #status { position: fixed; bottom: 8px; left: 12px; font-size: 10px; opacity: 0.5; pointer-events: none; z-index: 5; }
</style>
</head>
<body>

<canvas id="gl"></canvas>

<a id="adminToggle" href="?admin=1">⚙ admin</a>

<div id="admin">
  <button class="close" onclick="window.location.href=window.location.pathname">×</button>
  <h1>Apollonian Gasket · Controls</h1>

  <div class="group">
    <label>Recursion Depth <span class="val" id="vDepth">10</span></label>
    <input type="range" id="depth" min="1" max="20" value="10" step="1" />
    <label>Zoom Speed <span class="val" id="vZoomSpeed">0.06</span></label>
    <input type="range" id="zoomSpeed" min="0" max="0.4" value="0.06" step="0.005" />
    <label>Pan Speed <span class="val" id="vPanSpeed">0.10</span></label>
    <input type="range" id="panSpeed" min="0" max="0.5" value="0.10" step="0.01" />
    <label>Rotation Speed <span class="val" id="vRotSpeed">0.08</span></label>
    <input type="range" id="rotSpeed" min="-0.5" max="0.5" value="0.08" step="0.01" />
  </div>

  <div class="group">
    <label>Color Palette</label>
    <div class="palette" id="palettes"></div>
  </div>

  <div class="group">
    <label>Stroke Width <span class="val" id="vStroke">0.012</span></label>
    <input type="range" id="stroke" min="0" max="0.06" value="0.012" step="0.001" />
    <label>Fill Opacity <span class="val" id="vFill">0.18</span></label>
    <input type="range" id="fill" min="0" max="1" value="0.18" step="0.02" />
    <label>Glow Intensity <span class="val" id="vGlow">1.4</span></label>
    <input type="range" id="glow" min="0" max="3" value="1.4" step="0.1" />
  </div>

  <div class="group">
    <label>Background</label>
    <div class="row">
      <input type="color" id="bg1" value="#1a0010" />
      <input type="color" id="bg2" value="#0a0008" />
      <span style="font-size: 10px; opacity: 0.6;">→</span>
    </div>
    <label>Ring Opacity <span class="val" id="vBgMix">0.30</span></label>
    <input type="range" id="bgMix" min="0" max="1" value="0.30" step="0.02" />
  </div>
</div>

<div id="status">ok</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
